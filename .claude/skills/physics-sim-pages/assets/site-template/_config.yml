title: Simulasi Interaktif
description: Simulasi interaktif pendamping praktikum dan perkuliahan.
lang: id

# Pin the theme so updates never change pages silently.
# Check https://github.com/just-the-docs/just-the-docs/releases for the latest tag before first deploy.
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

# Project sites (username.github.io/repo) need the repo name here; user sites
# (username.github.io) use "". GitHub does not set this for you.
baseurl: ""

# owner/repo on GitHub; lets a JEKYLL_ENV=production build run locally.
# repository: username/repo

# Every page uses the theme layout unless it says otherwise (index.md uses home).
defaults:
  - scope:
      path: ""
    values:
      layout: default

color_scheme: light
footer_content: "Simulasi interaktif pendamping praktikum dan perkuliahan. Dibuat dengan Just the Docs."
search_enabled: true
heading_anchors: true

# kramdown turns $$...$$ into \( \) / \[ \], which KaTeX auto-render picks up.
kramdown:
  math_engine: mathjax

callouts:
  note:
    title: Perhatikan
    color: blue
  try:
    title: Coba
    color: green
  assume:
    title: Asumsi model
    color: grey-lt

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - "*.skill"
