title: Physics Sims
description: Interactive simulations for understanding physics.

# Pin the theme so updates never change pages silently.
# Check https://github.com/just-the-docs/just-the-docs/releases for the latest tag before first deploy.
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

# Project sites (username.github.io/repo): GitHub Pages usually sets this;
# set it explicitly for local preview, e.g. "/physics-sims".
baseurl: ""

# GitHub sets this automatically on deploy. Set it to "username/repo" only if you
# want to run a JEKYLL_ENV=production build locally.
# repository: username/repo

# Every page uses the theme layout unless it says otherwise (index.md uses home).
defaults:
  - scope:
      path: ""
    values:
      layout: default

color_scheme: light
search_enabled: true
heading_anchors: true

# kramdown turns $$...$$ into \( \) / \[ \], which KaTeX auto-render picks up.
kramdown:
  math_engine: mathjax

callouts:
  note:
    title: What to notice
    color: blue
  try:
    title: Try this
    color: green
  assume:
    title: Model assumptions
    color: grey-lt

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - "*.skill"
